name: Deploy SST Vision al VPS

on:
  push:
    branches: [claude/epp-review-corrections-aCTCa]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 72.61.75.57
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 300s
          script: |
            apt-get install -y python3-pip libgl1 libglib2.0-0 git -qq 2>/dev/null || true
            cd /opt
            if [ -d sst-app ]; then
              cd sst-app && git fetch origin && git checkout claude/epp-review-corrections-aCTCa && git pull
            else
              git clone -b claude/epp-review-corrections-aCTCa https://github.com/sstpacheco-max/herramienta-de-posturas sst-app
              cd sst-app
            fi
            cd cv_backend
            pip3 install -r requirements.txt -q
            pkill -f "uvicorn main:app" 2>/dev/null || true
            sleep 2
            nohup uvicorn main:app --host 0.0.0.0 --port 8000 > /opt/sst-app/app.log 2>&1 &
            sleep 3
            curl -s http://localhost:8000/api/status | python3 -c "import sys,json; d=json.load(sys.stdin); print('App corriendo:', d['status'])"
