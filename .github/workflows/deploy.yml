name: Deploy SST Vision al VPS

on:
  push:
    branches: [claude/epp-review-corrections-aCTCa]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar EasyPanel para redespliegue
        run: |
          echo "Triggering EasyPanel redeploy..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "http://72.61.75.57:3000/api/trpc/services.deployService" \
            -H "Authorization: Bearer ${{ secrets.EASYPANEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"json":{"projectName":"posturas","serviceName":"posturas"}}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP: $HTTP_CODE"
          echo "Response: $BODY"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Redespliegue iniciado en EasyPanel"
          else
            echo "⚠️ EasyPanel respondió: $HTTP_CODE — verifica el token o el nombre del servicio"
            # No fallar el workflow, el push ya fue a GitHub
            exit 0
          fi
