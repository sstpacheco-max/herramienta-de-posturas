name: Deploy SST Vision al VPS

on:
  push:
    branches: [claude/epp-review-corrections-aCTCa]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar push al repositorio
        run: |
          echo "✅ Código actualizado en GitHub"
          echo "Commit: ${{ github.sha }}"
          echo "Rama: ${{ github.ref_name }}"
          echo ""
          echo "EasyPanel detectará el nuevo commit y redespliegará automáticamente"
          echo "si tienes habilitado 'Auto Deploy' en la configuración del servicio."
          echo ""
          echo "Si no redespliegue automático: ir a EasyPanel → Deploy manualmente."
