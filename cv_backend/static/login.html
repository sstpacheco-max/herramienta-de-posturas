<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SST 4.0 - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --card-bg: rgba(26, 32, 44, 0.7);
            --accent-blue: #4facfe;
            --accent-green: #00e676;
            --accent-red: #ff4d4d;
            --text-primary: #e2e8f0;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glow-blue: 0 0 15px rgba(79, 172, 254, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(79, 172, 254, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 230, 118, 0.08) 0%, transparent 40%);
            padding: 1rem;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-header .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .brand-header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .form-group input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 0.75rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.2);
        }

        .btn-submit {
            background: linear-gradient(45deg, var(--accent-blue), #00f2fe);
            color: #000;
            border: none;
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: var(--glow-blue);
            transition: all 0.2s ease;
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(79, 172, 254, 0.6);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .error-message {
            background: rgba(255, 77, 77, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(255, 77, 77, 0.2);
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-bottom: 1.25rem;
            display: none;
            text-align: center;
        }

        .toggle-form {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .toggle-form a {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-form a:hover {
            text-decoration: underline;
        }

        /* Registro */
        .register-fields {
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="brand-header">
            <span class="logo">🛡️</span>
            <h1 id="title-text">SST 4.0 - INICIAR SESIÓN</h1>
            <p id="desc-text">Plataforma Multitenant de Visión Artificial</p>
        </div>

        <div id="error-box" class="error-message"></div>

        <form id="auth-form">
            <!-- Campos de Registro (Ocultos al inicio) -->
            <div class="form-group register-fields">
                <label for="company_name">Nombre de la Empresa</label>
                <input type="text" id="company_name" placeholder="Ej. Constructora Alfa S.A.">
            </div>
            
            <div class="form-group register-fields">
                <label for="license_key">Clave de Licencia</label>
                <input type="text" id="license_key" placeholder="Ej. ALFA-SST-2026">
            </div>

            <div class="form-group register-fields">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="admin@empresa.com">
            </div>

            <!-- Campos comunes / Login -->
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="admin">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="btn-text" class="btn-submit">Ingresar</button>
        </form>

        <div class="toggle-form">
            <span id="switch-prompt">¿No tienes cuenta?</span> 
            <a href="#" id="switch-mode-btn">Regístrate aquí</a>
        </div>
    </div>

    <script>
        const authForm = document.getElementById('auth-form');
        const switchModeBtn = document.getElementById('switch-mode-btn');
        const registerFields = document.querySelectorAll('.register-fields');
        const titleText = document.getElementById('title-text');
        const descText = document.getElementById('desc-text');
        const btnText = document.getElementById('btn-text');
        const switchPrompt = document.getElementById('switch-prompt');
        const errorBox = document.getElementById('error-box');

        let isLoginMode = true;

        switchModeBtn.onclick = (e) => {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            errorBox.style.display = 'none';

            if (isLoginMode) {
                titleText.textContent = 'SST 4.0 - INICIAR SESIÓN';
                descText.textContent = 'Plataforma Multitenant de Visión Artificial';
                btnText.textContent = 'Ingresar';
                switchPrompt.textContent = '¿No tienes cuenta?';
                switchModeBtn.textContent = 'Regístrate aquí';
                registerFields.forEach(el => el.style.display = 'none');
                
                document.getElementById('company_name').required = false;
                document.getElementById('license_key').required = false;
            } else {
                titleText.textContent = 'SST 4.0 - REGISTRO';
                descText.textContent = 'Crea una cuenta para tu empresa';
                btnText.textContent = 'Crear Cuenta';
                switchPrompt.textContent = '¿Ya tienes una cuenta?';
                switchModeBtn.textContent = 'Inicia sesión';
                registerFields.forEach(el => el.style.display = 'block');
                
                document.getElementById('company_name').required = true;
                document.getElementById('license_key').required = true;
            }
        };

        authForm.onsubmit = async (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            let url = '/api/auth/login';

            if (!isLoginMode) {
                url = '/api/auth/register';
                formData.append('company_name', document.getElementById('company_name').value);
                formData.append('license_key', document.getElementById('license_key').value);
                formData.append('email', document.getElementById('email').value);
            }

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await res.json();
                
                if (data.status === 'success') {
                    if (isLoginMode) {
                        // Guardar datos en sessionStorage para autenticación
                        sessionStorage.setItem('sst_user', JSON.stringify(data.user));
                        window.location.href = '/';
                    } else {
                        alert('Empresa registrada correctamente. Ahora puedes iniciar sesión.');
                        switchModeBtn.click(); // Cambiar a login
                    }
                } else {
                    errorBox.textContent = data.message || 'Error en la operación.';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorBox.textContent = 'No se pudo conectar con el servidor local.';
                errorBox.style.display = 'block';
            }
        };
    </script>
</body>
</html>
